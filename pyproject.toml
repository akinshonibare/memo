[project]
name = "memo"
version = "0.1.0"
description = "memo — capture everything, extract structure, ask questions"
authors = [
    { name = "akinshonibare", email = "akinkunmishonibare@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "anthropic>=1.8.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.52.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "alembic", "evals"]

[[tool.mypy.overrides]]
module = ["asgi_lifespan.*", "uuid6.*", "aioboto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60

[build-system]
requires = ["uv_build>=0.9.1,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.3",
]

