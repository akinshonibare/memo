# JavaScript changes reach the phone when they merge (ADR 0046): an OTA update on the
# `production` channel, only when a build with the same native fingerprint already
# exists. A native change finds no build, publishes nothing, and waits for `eas build`.
name: Update on merge

on:
  push:
    branches: ['main']
    paths: ['apps/mobile/**']

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production
  get_ios_build:
    name: Find the build this update fits
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production
      platform: ios
  publish_ios_update:
    name: Publish the update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: production
    params:
      channel: production
      platform: ios
